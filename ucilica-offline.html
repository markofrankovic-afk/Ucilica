<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Učilica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen app, sticky top bar, big touch tiles; every module gets its own crayon colour */
:root{
  --paper:#f7f6fb; --card:#ffffff; --ink:#2d2a3e; --muted:#6f6a86; --line:#e4e1ee; --ok:#22a06b; --bad:#e5484d; --star:#f5b301;
  --c-znam:#ff8a3d; --c-slova:#ff7a59; --c-brojke:#3d7bfd; --c-racun:#16a37f; --c-oblici:#f0a500; --c-boje:#e84393; --c-zivotinje:#9b6b4f; --c-pisanje:#7c4dff; --c-bojanka:#00a3bf; --c-citanje:#c2255c; --c-slikovnice:#364fc7; --c-novac:#b08900; --c-logika:#5c940d; --c-kviz:#f76707; --c-svijet:#0c8599; --c-osjecaji:#ae3ec9; --c-glazba:#495057; --c-hrvatska:#c62828; --c-linije:#1864ab; --c-brojalice:#e64980; --c-vrt:#2f9e44; --c-medalje:#e67700; --c-engleski:#1971c2; --c-kalendar:#0b7285; --c-promet:#e8590c; --c-programer:#5f3dc4; --c-usporedi:#4c6ef5; --c-zdravlje:#d6336c; --c-zanimanja:#a61e4d; --c-otpad:#37b24d; --c-svemir:#1c1f5c; --c-advent:#c92a2a; --c-snimi:#f08c00; --c-rodjendan:#e64980;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--line);flex:none}
.bar h1{flex:1;min-width:0;margin:0;font:600 clamp(22px,4vw,32px)/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:24px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer}
.ib:active{transform:translateY(2px)}
.ib:focus-visible,.tile:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.stars{font:700 22px var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
main{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:16px;align-items:center}
.hello{font:600 clamp(26px,5vw,44px)/1.1 var(--display);text-align:center;text-wrap:balance;margin:6px 0 0}
.sub{color:var(--muted);font-weight:800;font-size:18px;text-align:center;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.tile{--c:var(--ink);border:none;border-radius:24px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset,0 6px 0 var(--line);padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:150px;justify-content:center}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--line) inset,0 2px 0 var(--line)}
.tile .ic{width:84px;height:84px;border-radius:22px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:700 44px var(--display)}
.tile .ic svg{width:60px;height:60px}
.tile .nm{font:600 22px var(--display)}
.btn{border:none;border-radius:20px;padding:12px 22px;min-height:58px;font:600 22px var(--display);background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 0 0 3px var(--line) inset,0 5px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.prompt{display:flex;align-items:center;gap:12px;font:600 clamp(24px,4.6vw,40px)/1.15 var(--display);text-align:center;text-wrap:balance;justify-content:center}
.prompt .ib{flex:none}
.opts{display:grid;gap:14px;width:100%;max-width:760px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{border:none;border-radius:26px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset,0 6px 0 var(--line);min-height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer;font:700 clamp(54px,11vw,92px)/1 var(--display);padding:10px;transition:background .2s}
.opt svg{width:min(120px,80%);height:auto}
.opt.ok{background:#dff6ea;box-shadow:0 0 0 4px var(--ok) inset,0 6px 0 var(--ok)}
.opt.no{opacity:.35;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--star)}
.card{background:var(--card);border-radius:30px;box-shadow:0 0 0 3px var(--line) inset;padding:20px;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.big{font:700 clamp(110px,26vw,200px)/1 var(--display)}
.big small{font-size:.55em;color:var(--muted);margin-left:.15em}
.word{font:600 clamp(30px,6vw,52px)/1.1 var(--display)}
.word b{color:var(--c,var(--ink))}
.emo{font-size:clamp(70px,16vw,120px);line-height:1}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;width:100%}
.mini button{border:none;border-radius:18px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset,0 4px 0 var(--line);min-height:76px;font:700 34px var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px}
.mini button svg{width:52px;height:52px}
.mini button.done{box-shadow:0 0 0 3px var(--ok) inset,0 4px 0 var(--ok)}
.count{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;font-size:clamp(40px,8vw,64px);line-height:1}
.count span{cursor:pointer;transition:transform .15s;position:relative}
.count span.c{transform:scale(.85);filter:saturate(.6)}
.count span.c::after{content:attr(data-n);position:absolute;right:-4px;top:-6px;font:700 20px var(--display);background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font:700 clamp(40px,8vw,60px) var(--display)}
.grp{display:flex;flex-wrap:wrap;gap:4px;max-width:230px;justify-content:center;font-size:clamp(30px,6vw,46px);background:var(--card);border-radius:20px;padding:10px;box-shadow:0 0 0 3px var(--line) inset}
.pots{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pot{width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 0 0 4px var(--line) inset,0 6px 0 var(--line)}
.pot.sel{box-shadow:0 0 0 6px var(--ink) inset,0 6px 0 var(--ink)}
.bowl{width:180px;height:180px;border-radius:50%;box-shadow:0 0 0 6px var(--line) inset;background:#fff;transition:background .8s}
.bowl.swirl{animation:swirl .9s ease-in-out}@keyframes swirl{50%{transform:rotate(200deg) scale(.92)}}
.bowl.drops{position:relative;overflow:hidden}.drop{position:absolute;left:50%;top:-20px;width:22px;height:28px;margin-left:-11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;animation:dropin .6s ease-in forwards}
@keyframes dropin{to{top:80px;opacity:0;transform:scale(.6)}}
.dropcnt{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:30px;font:700 20px var(--display)}.dropcnt span{display:flex;align-items:center;gap:4px}.dropcnt i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px var(--line) inset}
.mixopt{display:flex;align-items:center;gap:6px;justify-content:center}.mixopt i{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px var(--line) inset}.mixopt b{font:700 30px var(--display)}
.duga-box{width:min(94vw,640px)}.duga-svg{width:100%;height:auto;display:block;touch-action:none}
.dg-arc{fill:#fff;stroke:#2d2a3e;stroke-width:2.5;stroke-dasharray:7 5;transition:fill .4s}.dg-arc.ok{stroke-dasharray:none}.dg-arc.nx{animation:nx 1s infinite}.dg-arc.hot{fill:#eee}
@keyframes nx{50%{fill:#ffe9a8}}.dg-cl ellipse{fill:#fff;stroke:#c8cbe0;stroke-width:2}.dg-sun{opacity:0;transition:opacity 1s}.duga-svg.win .dg-sun{opacity:1}.duga-svg.win .dg-arc{animation:shine 1.6s ease-in-out 2}
@keyframes shine{50%{filter:brightness(1.25) saturate(1.3)}}
.duga-cols{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}.dg-col{border:none;background:var(--card);border-radius:18px;box-shadow:0 0 0 3px var(--line) inset,0 4px 0 var(--line);padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:none;position:relative;z-index:1}
.dg-col i{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.15) inset}.dg-col small{font:600 15px var(--display)}.dg-col.used{opacity:.3}.dg-col.drag{z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.canvasbox{position:relative;width:min(92vw,560px,calc(100vh - 290px));aspect-ratio:1;max-width:100%}
.canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:26px;background:#fff;box-shadow:0 0 0 3px var(--line) inset;touch-action:none}
.color-wrap{display:flex;gap:16px;width:100%;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.svgbox{width:min(92vw,600px,calc(100vh - 210px));max-width:100%;aspect-ratio:1;background:#fff;border-radius:26px;box-shadow:0 0 0 3px var(--line) inset;padding:8px;box-sizing:border-box}
.svgbox svg{width:100%;height:100%;display:block;touch-action:manipulation}
.pal{display:grid;grid-template-columns:repeat(4,52px);gap:10px;align-content:start}
@media (max-width:900px){.pal{grid-template-columns:repeat(8,minmax(34px,52px));width:100%;justify-content:center}}
.pal button{width:100%;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.12) inset}
.pal button.sel{box-shadow:0 0 0 5px var(--ink) inset;transform:scale(1.1)}
.r{fill:#fff;stroke:#2d2a3e;stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill .25s}
.ns{vector-effect:non-scaling-stroke;stroke-width:2.2px}.l.det{stroke-width:1px;stroke:#2d2a3e}
.l{fill:none;stroke:#2d2a3e;stroke-width:3;stroke-linecap:round;pointer-events:none}
.k{fill:#2d2a3e;pointer-events:none}.vs *{vector-effect:non-scaling-stroke}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.thumbs button{border:none;background:var(--card);border-radius:22px;box-shadow:0 0 0 3px var(--line) inset,0 5px 0 var(--line);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 20px var(--display)}
.thumbs svg{width:100%;aspect-ratio:1;height:auto}
.thumbs .r{stroke-width:4}
.homeTop{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.pathcard{border:none;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:24px;padding:12px 22px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.2);min-height:78px}
.pathcard .pe{font-size:44px}.pathcard b{display:block;font:600 26px var(--display)}.pathcard small{font-weight:800;font-size:16px;opacity:.85}
.parentBtn{font-size:16px;min-height:44px;padding:8px 16px;margin-top:6px}
.opt.txt{font:600 clamp(19px,3.2vw,26px)/1.2 var(--display);min-height:96px;flex-direction:column;gap:6px;text-align:center}
.opt .em{font-size:clamp(54px,10vw,84px);line-height:1}
.opt .lb{font:600 clamp(20px,3.4vw,28px) var(--display)}
.opts.lr{max-width:820px}.opts.lr .opt{min-height:clamp(180px,34vh,300px);flex-direction:column;gap:10px}
.opts.lr .opt::before{font:700 16px var(--body);color:var(--muted);order:3}
.opts.lr .opt:first-child::before{content:'⬅ lijevo'}.opts.lr .opt:last-child::before{content:'desno ➡'}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(52px,12vw,76px);height:clamp(62px,14vw,88px);border-radius:16px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset;display:flex;align-items:center;justify-content:center;font:700 clamp(32px,7vw,48px) var(--display)}
.slot.f{box-shadow:0 0 0 3px var(--ok) inset;background:#eafaf1}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:620px}
.letters button{width:clamp(56px,13vw,80px);height:clamp(56px,13vw,80px);border:none;border-radius:18px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset,0 5px 0 var(--line);font:700 clamp(30px,7vw,44px) var(--display);cursor:pointer}
.letters button.used{visibility:hidden}.letters button.no{animation:shake .4s}
.memgrid{display:grid;gap:10px;width:100%;max-width:620px}
.mem{aspect-ratio:1;border:none;border-radius:18px;cursor:pointer;font-size:clamp(34px,8vw,56px);background:var(--c-logika);color:transparent;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .2s,background .2s}
.mem.up,.mem.got{background:var(--card);color:inherit;box-shadow:0 0 0 3px var(--line) inset}.mem.got{box-shadow:0 0 0 3px var(--ok) inset;opacity:.8}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(38px,8vw,60px);background:var(--card);padding:12px 16px;border-radius:22px;box-shadow:0 0 0 3px var(--line) inset}
.seq .q{display:inline-flex;width:1.1em;justify-content:center;border-radius:12px;background:#fff3bf;font:700 .8em var(--display);align-items:center}
.puz{display:grid;gap:4px;width:min(86vw,420px);aspect-ratio:1;background:var(--line);padding:4px;border-radius:20px}
.puz button{border:none;padding:0;cursor:pointer;background-repeat:no-repeat;border-radius:10px;outline-offset:-4px}
.puz button.sel{outline:5px solid var(--ink)}
.row5{display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.row5 button{border:none;background:var(--card);border-radius:18px;font-size:clamp(40px,9vw,64px);padding:8px;cursor:pointer;box-shadow:0 0 0 3px var(--line) inset,0 5px 0 var(--line)}
.row5 button.ok{box-shadow:0 0 0 4px var(--ok) inset}.row5 button.no{opacity:.35}
.flag{font-size:40px}
.cmp{display:flex;align-items:center;gap:18px;justify-content:center;font:700 clamp(54px,12vw,90px) var(--display)}
.cmp .box{min-width:1.4em;text-align:center;border-radius:20px;background:var(--card);box-shadow:0 0 0 3px var(--line) inset;padding:0 12px}
.cmp .qq{color:var(--muted)}
.wallet{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wallet button{border:none;background:none;cursor:pointer;padding:0}
.paid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:70px;align-items:center;background:var(--card);border-radius:20px;padding:8px 14px;box-shadow:0 0 0 3px var(--line) inset;min-width:240px}
.price{font:700 clamp(30px,6vw,44px) var(--display);display:flex;align-items:center;gap:12px}
.price .tag{background:#fff3bf;border-radius:14px;padding:4px 14px;box-shadow:0 0 0 3px #f2d36b inset}
.pict{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 0 0 3px var(--line) inset}
.pict div{display:flex;gap:6px;font-size:clamp(28px,6vw,40px);align-items:center;border-bottom:2px dashed var(--line);padding-bottom:6px}
.pict div:last-child{border:none}
.story{max-width:720px;width:100%;background:var(--card);border-radius:28px;box-shadow:0 0 0 3px var(--line) inset;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.sscene{position:relative;width:100%;aspect-ratio:16/10;max-height:44vh;border-radius:22px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:0 4% 7%;box-sizing:border-box;line-height:1;box-shadow:0 0 0 3px var(--line) inset}
.sscene i{font-style:normal;display:block;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.sscene i:nth-child(2){animation-delay:.4s}.sscene i:nth-child(3){animation-delay:.8s}.sscene i:nth-child(4){animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.sscene::before,.sscene::after{position:absolute;font-size:clamp(28px,7vw,54px);line-height:1;opacity:.95}
.sscene::before{left:6%;top:7%}.sscene::after{right:6%;top:6%}
.bg-dan{background:linear-gradient(#bfe6ff 0 60%,#9be08a 60%)}.bg-dan::before{content:'☁️'}.bg-dan::after{content:'☀️'}
.bg-noc{background:linear-gradient(#1d2557,#424a9a 60%,#2f5d3a 60%)}.bg-noc::before{content:'✨'}.bg-noc::after{content:'🌙'}
.bg-snijeg{background:linear-gradient(#cfe0f2 0 58%,#fff 58%)}.bg-snijeg::before{content:'❄️'}.bg-snijeg::after{content:'❄️'}
.bg-kuca{background:linear-gradient(#fde2e4 0 66%,#e9c9a4 66%)}.bg-kuca::before{content:'🖼️'}.bg-kuca::after{content:'🪟'}
.bg-more{background:linear-gradient(#bfe6ff 0 42%,#4fb3e8 42% 64%,#f4dca0 64%)}.bg-more::before{content:'⛵'}.bg-more::after{content:'☀️'}
.bg-jesen{background:linear-gradient(#ffe8c2 0 60%,#d9a35b 60%)}.bg-jesen::before{content:'🍂'}.bg-jesen::after{content:'🌤️'}
.bg-farma{background:linear-gradient(#cdeeff 0 60%,#b8d97a 60%)}.bg-farma::before{content:'🌾'}.bg-farma::after{content:'☀️'}
.bg-nebo{background:linear-gradient(#8fd0ff,#eaf7ff);align-items:center;padding-bottom:0}.bg-nebo::before{content:'☁️'}.bg-nebo::after{content:'☁️'}
.story p{font:600 clamp(22px,4vw,32px)/1.45 var(--display);margin:0;text-align:center;text-wrap:pretty}
.story .w.on{background:#fff3bf;border-radius:6px;box-shadow:0 0 0 3px #fff3bf}
.piano{display:flex;gap:6px;width:100%;max-width:820px;height:min(46vh,320px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.piano button span{pointer-events:none}
.piano button{flex:1;border:none;border-radius:0 0 18px 18px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font:700 clamp(16px,3vw,24px) var(--display);color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18);transition:transform .08s}
.piano button.hit{transform:translateY(6px);filter:brightness(1.15)}
.piano button.next{outline:6px solid var(--ink);outline-offset:-6px;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.days{display:flex;flex-direction:column;gap:8px;width:100%;max-width:480px}
.days button{border:none;border-radius:16px;padding:12px 18px;font:600 24px var(--display);color:#fff;cursor:pointer;text-align:left}
.ptab{width:100%;max-width:640px;border-collapse:collapse;font-size:18px;background:var(--card);border-radius:16px;overflow:hidden}
.ptab td,.ptab th{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.ptab td.n{text-align:right;font-variant-numeric:tabular-nums}
.mem span{visibility:hidden}.mem.up span,.mem.got span{visibility:visible}
.lbl{font-weight:800;font-size:18px;margin:6px 0 2px}
.pathcard.small{padding:10px 18px;min-height:70px}.pathcard.small b{font-size:22px}
.scene{position:relative;width:100%;max-width:820px;aspect-ratio:4/3;border-radius:26px;overflow:hidden;box-shadow:0 0 0 3px var(--line) inset;touch-action:none}
.scene.vrt{background:linear-gradient(#a9dcff,#dff3ff 50%,#8fd67a 50%,#7cc768 100%)}
.scene.soba{background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.35) 22px 30px),linear-gradient(#ffe3ea 0 62%,#f7c9a8 62% 63.2%,#e2b48a 63.2%,#d9a679 100%)}
.scene.soba::after{content:'';position:absolute;left:0;right:0;top:63.2%;bottom:0;background:repeating-linear-gradient(90deg,rgba(120,70,40,.12) 0 2px,transparent 2px 13%);pointer-events:none}

let ac=null,acUnlocked=false;function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running'&&ac.state!=='closed')ac.resume().catch(()=>{});
  if(!acUnlocked&&ac.state==='running'){acUnlocked=true;const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}}catch(e){}}
/* run fn once the audio context is really running (Android/iOS start it suspended until a tap) */
function withAudio(fn){audio();if(!ac)return;if(ac.state==='running')fn();else ac.resume().then(()=>{if(ac.state==='running')fn();}).catch(()=>{});}
function tone(f1,f2,d,type='sine',vol=.08,delay=0){if(!ac)return;if(ac.state!=='running'){withAudio(()=>tone(f1,f2,d,type,vol,delay));return;}const t=ac.currentTime+.005+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);}

const TTS=window.speechSynthesis||null;let hrVoice=null,voiceOn=load('voice',true),lastPrompt='',warned=false;
function pickVoice(){if(!TTS)return;const vs=TTS.getVoices();let best=null,bs=0;
  for(const v of vs){const l=(v.lang||'').toLowerCase().replace('_','-'),n=v.name.toLowerCase();let s=0;
    if(l.startsWith('hr'))s=100;else if(l.startsWith('bs'))s=60;else if(l.startsWith('sr')&&(l.includes('latn')||n.includes('latin')))s=50;else continue;
    if(n.includes('natural'))s+=20;if(n.includes('online'))s+=8;if(n.includes('google'))s+=10;if(/gabrijela|lana/.test(n))s+=5;if(s>bs){bs=s;best=v;}}
  hrVoice=best;}
if(TTS){pickVoice();try{TTS.addEventListener('voiceschanged',pickVoice);}catch(e){}}
function clean(t){return String(t).replace(/[\u{1F300}-\u{1FAFF}☀-➿️⭐]/gu,'').replace(/\s+/g,' ').trim();}
function say(t,opt={}){t=KX(t);if(opt.prompt)lastPrompt=t;if(!voiceOn||!TTS)return;t=clean(t);if(!t)return;
  if(!hrVoice){pickVoice();if(!hrVoice&&!warned&&TTS.getVoices().length){warned=true;toast('Nema hrvatskog glasa. Otvori u pregledniku Edge.');}}
  try{const u=new SpeechSynthesisUtterance(t);u.lang=hrVoice?hrVoice.lang:'hr-HR';if(hrVoice)try{u.voice=hrVoice;}catch(e){}
    u.rate=opt.rate||.92;u.pitch=1.1;if(opt.onend){u.onend=opt.onend;u.onerror=opt.onend;}speakU(u,opt.queue!==true);}catch(e){}}
/* polite speech: never cuts the current sentence; waits until it ends + 1 s, and only the newest request is spoken */
let politeNext=null,politeTimer=null;
function sayPolite(t){if(!voiceOn||!TTS)return;politeNext=t;if(!politeTimer)politeTimer=setInterval(()=>{if(!politeNext){clearInterval(politeTimer);politeTimer=null;return;}
  if(TTS.speaking||TTS.pending){return;}if(Date.now()-lastEnd<1000)return;const n=politeNext;politeNext=null;say(n,{queue:true});lastEnd=Date.now()+8000;},150);}
/* speak, then run fn one second after the voice has finished (with a safety timer) */
function sayThen(t,fn,pause=1000){let done=false;const go=()=>{if(done)return;done=true;clearTimeout(st);setTimeout(fn,pause);};
  const st=setTimeout(go,(voiceOn&&TTS?Math.max(1800,clean(t).length*95):900));say(t,{onend:go});}
/* Chrome on Android drops an utterance spoken right after cancel(): wait a moment after cancelling */
let speakT=null,lastEnd=0;function speakU(u,interrupt){clearTimeout(speakT);try{u.addEventListener('end',()=>{lastEnd=Date.now();});u.addEventListener('error',()=>{lastEnd=Date.now();});}catch(e){}const busy=TTS.speaking||TTS.pending;
  if(interrupt&&busy){TTS.cancel();speakT=setTimeout(()=>{try{TTS.resume();TTS.speak(u);}catch(e){}},120);}else{try{TTS.resume();TTS.speak(u);}catch(e){}}}
if(!TTS)setTimeout(()=>toast('Ovaj preglednik nema glas. Otvori aplikaciju u Chromeu, Safariju ili Edgeu.'),1500);

const fx=$('#fx'),fctx=fx.getContext('2d');let bits=[],fxOn=false;
function confetti(n=80){fx.width=innerWidth;fx.height=innerHeight;const cols=['#ff7a59','#3d7bfd','#16a37f','#f0a500','#e84393','#7c4dff','#00a3bf'];
  for(let i=0;i<n;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-6-Math.random()*10,r:Math.random()*6.3,s:6+Math.random()*8,c:pick(cols),l:90+rnd(40)});

  bits=bits.filter(b=>b.l>0&&b.y<fx.height+20);if(bits.length)requestAnimationFrame(fxStep);else{fxOn=false;fctx.clearRect(0,0,fx.width,fx.height);}}

      else{tries++;b.classList.add('no');SFX.no();say((o.say?o.say+'. ':'')+'Pokušaj ponovno.');}},o.label||'');opts.appendChild(b);});

const RYB=[[1,1,1],[.9,.22,.21],[.99,.85,.21],[.98,.55,0],[.12,.39,.84],[.56,.14,.67],[.26,.63,.28],[.36,.22,.12]];
function ryb2rgb(r,y,b){const L=(a,c,t)=>a+(c-a)*t;const C=i=>RYB[i];const out=[0,1,2].map(k=>{
    const c00=L(C(0)[k],C(1)[k],r),c01=L(C(4)[k],C(5)[k],r),c10=L(C(2)[k],C(3)[k],r),c11=L(C(6)[k],C(7)[k],r);
    return L(L(c00,c10,y),L(c01,c11,y),b);});return out;}

function traceScreen(kind,idx){const items=kind==='slova'?LETTERS.map(l=>l[0]):kind==='imena'?NAMES:'0123456789'.split('');const spoken=kind==='slova'?LETTERS.map(l=>'slovo '+l[1]):kind==='imena'?NAMES.map(n=>'riječ '+n.toLowerCase()):NUMW.slice(0,10).map(n=>'broj '+n);

  const w=screen('Slagalica',modLogika,CL);const em=pick(PUZ);const cv=document.createElement('canvas');cv.width=cv.height=480;const x=cv.getContext('2d');
  const bg=pick(['#fff3bf','#d3f9d8','#d0ebff','#ffe3e3','#f3d9fa']);x.fillStyle=bg;x.fillRect(0,0,480,480);x.font='380px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(em,240,265);
  x.strokeStyle='rgba(45,42,62,.15)';x.lineWidth=6;x.strokeRect(3,3,474,474);const url=cv.toDataURL();

function modSlikovnice(){const w=screen('Slikovnice',home,CS2);w.appendChild(el('p','hello','Odaberi priču'));const g=el('div','tiles');

function storyScene(sc,bg){const d=el('div','sscene bg-'+(bg||'dan'));let g;try{g=[...new Intl.Segmenter('hr',{granularity:'grapheme'}).segment(sc)].map(x=>x.segment);}catch(e){g=Array.from(sc);}
  g=g.filter(x=>x.trim());const fs=g.length>=4?'clamp(44px,11vw,84px)':g.length===3?'clamp(52px,13vw,96px)':'clamp(64px,16vw,120px)';d.style.fontSize=fs;g.forEach(x=>d.appendChild(el('i','',x)));return d;}
function story(si,pi){const S=STORIES[si];if(pi>=S.pages.length)return storyQuiz(si);const [sc0,tx0,bg]=S.pages[pi];const tx=KX(tx0),sc=KX(sc0);const w=screen(S.t,modSlikovnice,CS2);
  const dots=el('div','dots');S.pages.forEach((_,i)=>dots.appendChild(el('i',i<=pi?'on':'')));w.appendChild(dots);
  const c=el('div','story');c.appendChild(storyScene(sc,bg));const p=el('p','');let pos=0;const spans=[];
  tx.split(/(\s+)/).forEach(t=>{if(/^\s+$/.test(t)){p.appendChild(document.createTextNode(t));pos+=t.length;return;}const sp=el('span','w',t);sp.dataset.s=pos;pos+=t.length;spans.push(sp);p.appendChild(sp);});
  c.appendChild(p);const r=el('div','row');r.appendChild(button('btn soft','⟵',()=>story(si,Math.max(0,pi-1)),'Natrag'));r.appendChild(button('btn','🔊 Čitaj',read));r.appendChild(button('btn soft','⟶',()=>story(si,pi+1),'Dalje'));c.appendChild(r);w.appendChild(c);
  function read(){spans.forEach(s=>s.classList.remove('on'));if(!voiceOn||!TTS)return;try{const u=new SpeechSynthesisUtterance(tx);u.lang=hrVoice?hrVoice.lang:'hr-HR';if(hrVoice)try{u.voice=hrVoice;}catch(e){}u.rate=.85;u.pitch=1.1;
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;spans.forEach(s=>s.classList.toggle('on',+s.dataset.s<=e.charIndex&&e.charIndex<+s.dataset.s+s.textContent.length));};
    u.onend=()=>spans.forEach(s=>s.classList.remove('on'));speakU(u,true);}catch(e){}}
  lastPrompt=tx;setTimeout(read,250);}
function storyQuiz(si){const S=STORIES[si];let qi=0;quiz({title:S.t,stat:'Slikovnice',back:modSlikovnice,color:CS2,rounds:S.qs.length,make:()=>{const q=S.qs[qi++];
  return{text:q[0],speak:q[0],answer:q[1][0][1],cols:3,options:shuffle(q[1]).map(o=>({v:o[1],cls:'txt',html:`<span class="em">${o[0]}</span><span class="lb">${o[1]}</span>`,label:o[1],say:''}))};}});}

let pianoOut=null;
function note(i,d=.9){withAudio(()=>{if(!pianoOut){pianoOut=ac.createDynamicsCompressor();pianoOut.threshold.value=-14;pianoOut.ratio.value=4;pianoOut.connect(ac.destination);}
  const f=KEYS[i][2]*2,t=ac.currentTime+.005,g=ac.createGain();g.connect(pianoOut);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  [[1,'sine',1],[2,'triangle',.35],[3,'sine',.18],[4.2,'sine',.08]].forEach(([m,ty,v])=>{const o=ac.createOscillator(),og=ac.createGain();o.type=ty;o.frequency.value=f*m;og.gain.value=v;
    if(m>2){og.gain.setValueAtTime(v,t);og.gain.exponentialRampToValueAtTime(.0001,t+.25);}o.connect(og).connect(g);o.start(t);o.stop(t+d+.05);});});}

function startPath(){const today=new Date().toDateString();let seed=[...today].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);const rr=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};

  const p=pool.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[p[i],p[j]]=[p[j],p[i]];}

  elm.addEventListener('pointermove',e=>{if(!down)return;const d=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;const q=elm.getBoundingClientRect();onMove(d,(e.clientX-q.left)/q.width,(e.clientY-q.top)/q.height);});

  sc.innerHTML=`<div class="zr-walk"></div><div class="zr-road"><div class="zr-zebra"></div></div><div class="zr-walk b"></div><div class="zr-light"><i class="r on"></i><i class="g"></i></div><div class="zr-kid">🧒</div><div class="zr-car">🚗</div>`;
  const kid=sc.querySelector('.zr-kid'),car=sc.querySelector('.zr-car'),lr=sc.querySelector('.zr-light .r'),lg=sc.querySelector('.zr-light .g');
  const btns=el('div','row');w.appendChild(btns);let i=0,green=false,miss=0,alive=true;

    if(s[0]==='green'){setTimeout(()=>{if(!alive)return;green=true;lr.classList.remove('on');lg.classList.add('on');SFX.ok();say('Zeleno je!');i++;setTimeout(show,900);},3500);
      btns.appendChild(button('btn soft','🚶 Idem!',()=>{miss++;SFX.no();say('Stani! Još je crveno. Čekamo zeleno.');sc.classList.add('warn');setTimeout(()=>sc.classList.remove('warn'),600);}));return;}
    const seen={};seen[s[2]]=1;const opts=[s].concat(shuffle(steps.filter(x=>x[2]&&!seen[x[2]]&&(seen[x[2]]=1))).slice(0,2));
    shuffle(opts).forEach(o=>btns.appendChild(button('btn',o[2],()=>{if(o!==s){miss++;SFX.no();say(o[0]==='go'?'Stani! Još nismo pogledali.':'Ne još. '+s[1]);return;}

      i++;setTimeout(show,500);})));}
  show();}

const LINES=(()=>{const L=[];const pts=f=>{const a=[];for(let i=0;i<=120;i++)a.push(f(i/120));return a;};
  L.push(['Ravna crta',pts(t=>[.12+.76*t,.5])]);L.push(['Okomita crta',pts(t=>[.5,.15+.7*t])]);L.push(['Kosa crta',pts(t=>[.15+.7*t,.2+.6*t])]);
  L.push(['Valovi',pts(t=>[.1+.8*t,.5+Math.sin(t*Math.PI*4)*.15])]);L.push(['Cik-cak',pts(t=>{const k=t*6,f=k-Math.floor(k);return[.1+.8*t,.35+(Math.floor(k)%2?1-f:f)*.3];})]);
  L.push(['Brežuljci',pts(t=>[.1+.8*t,.65-Math.abs(Math.sin(t*Math.PI*3))*.3])]);L.push(['Petlje',pts(t=>{const a=t*Math.PI*8;return[.15+.7*t-.06*Math.sin(a),.5-.12*Math.cos(a)+.0];})]);
  L.push(['Krug',pts(t=>[.5+.32*Math.cos(t*Math.PI*2-Math.PI/2),.5+.32*Math.sin(t*Math.PI*2-Math.PI/2)])]);L.push(['Kvadrat',pts(t=>{const s=t*4,k=Math.floor(Math.min(3.999,s)),f=s-k;return [[.2+.6*f,.2],[.8,.2+.6*f],[.8-.6*f,.8],[.2,.8-.6*f]][k];})]);
  L.push(['Spirala',pts(t=>{const a=t*Math.PI*5,r=.04+.32*t;return[.5+r*Math.cos(a),.5+r*Math.sin(a)];})]);return L;})();
function lineTrace(idx){const [name,P]=LINES[idx];const w=screen('Prati liniju',modLinije,CLN);
  const strip=el('div','mini');strip.style.gridTemplateColumns='repeat(auto-fill,minmax(110px,1fr))';LINES.forEach((l,i)=>{const b=button(load('lineDone',{})[i]?'done':'',l[0],()=>lineTrace(i),l[0]);b.style.fontSize='16px';b.style.minHeight='48px';if(i===idx)b.style.background='#e7f5ff';strip.appendChild(b);});
  const box=el('div','canvasbox');const cv=el('canvas');box.appendChild(cv);const r=el('div','row');r.appendChild(button('btn soft','🧽 Obriši',()=>{clr();say('Probaj ponovno.');}));r.appendChild(button('btn soft','⟶',()=>lineTrace((idx+1)%LINES.length),'Sljedeće'));
  w.appendChild(el('div','prompt',name));w.appendChild(box);w.appendChild(r);w.appendChild(strip);
  let S,ctx,um,tm,dm,lw,guide,ok=false,drawing=false,last=null;const dpr=Math.min(2,devicePixelRatio||1);
  function setup(){if(!document.body.contains(cv))return;const rc=cv.getBoundingClientRect();if(rc.width<20){requestAnimationFrame(setup);return;}S=Math.round(rc.width*dpr);cv.width=cv.height=S;ctx=cv.getContext('2d');
    const mk=()=>{const c=document.createElement('canvas');c.width=c.height=S;return c.getContext('2d',{willReadFrequently:true});};um=mk();tm=mk();dm=mk();lw=S*.05;
    const path=c=>{c.beginPath();P.forEach(([x,y],i)=>i?c.lineTo(x*S,y*S):c.moveTo(x*S,y*S));};
    ctx.lineCap=ctx.lineJoin='round';path(ctx);ctx.strokeStyle='#e7f5ff';ctx.lineWidth=S*.075;ctx.stroke();path(ctx);ctx.setLineDash([S*.02,S*.02]);ctx.strokeStyle='#74a9d8';ctx.lineWidth=Math.max(2,S*.008);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#22a06b';ctx.beginPath();ctx.arc(P[0][0]*S,P[0][1]*S,S*.03,0,7);ctx.fill();ctx.font=`${S*.06}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',P[P.length-1][0]*S,P[P.length-1][1]*S);
    dm.lineCap=dm.lineJoin='round';path(dm);dm.lineWidth=S*.13;dm.stroke();guide=ctx.getImageData(0,0,S,S);}
  function clr(){ctx.putImageData(guide,0,0);um.clearRect(0,0,S,S);tm.clearRect(0,0,S,S);ok=false;}
  const pt=e=>{const q=cv.getBoundingClientRect();return[(e.clientX-q.left)/q.width*S,(e.clientY-q.top)/q.height*S];};
  function line(a,b){for(const c of [ctx,um,tm]){c.strokeStyle=c===ctx?'#1864ab':'#000';c.lineWidth=c===um?lw*2.4:lw;c.lineCap=c.lineJoin='round';c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}}
  cv.addEventListener('pointerdown',e=>{if(ok)return;drawing=true;last=pt(e);line(last,last);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);line(last,p);last=p;});
  const up=()=>{if(!drawing)return;drawing=false;check();};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function check(){const U=um.getImageData(0,0,S,S).data,T=tm.getImageData(0,0,S,S).data,D=dm.getImageData(0,0,S,S).data;let c=0;
    P.forEach(([x,y])=>{const i=(Math.round(y*S)*S+Math.round(x*S))*4+3;if(U[i]>100)c++;});let u=0,o=0;const st=Math.max(3,Math.round(S/70));
    for(let y=0;y<S;y+=st)for(let x=0;x<S;x+=st){const i=(y*S+x)*4+3;if(T[i]>100){u++;if(D[i]<50)o++;}}

      sayThen(pick(PRAISE),()=>{if(document.body.contains(cv))lineTrace((idx+1)%LINES.length);});}

  requestAnimationFrame(setup);say(`${name}. Kreni od zelene točke i prati liniju do zvjezdice.`,{prompt:true});}
const DOTS=[['zvijezda','⭐','#f0a500',[[50,6],[61,38],[95,38],[68,58],[79,92],[50,72],[21,92],[32,58],[5,38],[39,38]]],['kućica','🏠','#e8590c',[[20,92],[20,46],[50,14],[80,46],[80,92]]],

  const tick=setInterval(()=>{if(!document.body.contains(g)){clearInterval(tick);return;}const left=secs-(performance.now()-t0)/1000;fill.style.width=Math.max(0,left/secs*100)+'%';

    [...g.children].forEach(c=>c.classList.add('cover'));pr.textContent='Zatvori oči…';SFX.pop();

/* ================= MALI PROGRAMER ================= */
const CPR='var(--c-programer)';
const DIRS={u:[0,-1,'⬆️','gore'],d:[0,1,'⬇️','dolje'],l:[-1,0,'⬅️','lijevo'],r:[1,0,'➡️','desno']};
const PRGOAL=['⭐','🍎','🌈','🎁','🍓','💎'];
function makeLevel(n){const N=LVL?6:5;for(let t=0;t<400;t++){const len=Math.min(LVL?9:6,2+Math.floor(n/2)+(LVL?2:0));const sx=rnd(N),sy=rnd(N);let x=sx,y=sy;const path=[[x,y]];const moves=[];
    for(let k=0;k<len;k++){const opts=Object.keys(DIRS).filter(d=>{const nx=x+DIRS[d][0],ny=y+DIRS[d][1];return nx>=0&&ny>=0&&nx<N&&ny<N&&!path.some(p=>p[0]===nx&&p[1]===ny);});
      if(!opts.length)break;const d=moves.length&&Math.random()<.55&&opts.includes(moves[moves.length-1])?moves[moves.length-1]:pick(opts);x+=DIRS[d][0];y+=DIRS[d][1];path.push([x,y]);moves.push(d);}
    if(moves.length<Math.max(2,len-1))continue;const gx=x,gy=y;if(Math.abs(gx-sx)+Math.abs(gy-sy)<2)continue;
    const rocks=[];const nr=LVL?4+rnd(4):Math.min(4,1+Math.floor(n/2));for(let i=0;i<nr*3&&rocks.length<nr;i++){const rx=rnd(N),ry=rnd(N);if(path.some(p=>p[0]===rx&&p[1]===ry)||rocks.some(p=>p[0]===rx&&p[1]===ry))continue;rocks.push([rx,ry]);}
    const gems=[];if(n>=2){const p=path[1+rnd(path.length-2)];if(p&&!(p[0]===gx&&p[1]===gy))gems.push(p);}
    return{N,sx,sy,gx,gy,rocks,gems,best:moves.length,goal:PRGOAL[n%PRGOAL.length]};}
  return{N:5,sx:0,sy:0,gx:2,gy:0,rocks:[],gems:[],best:2,goal:'⭐'};}
function modProgramer(){programer(load('prLvl',0));}
function programer(n){const L=makeLevel(n);const w=screen(`Mali programer · ${n+1}. zadatak`,home,CPR);let prog=[],running=false;
  w.appendChild(el('p','sub',`Složi strelice da 🦄 dođe do ${L.goal}. Pazi na drveće!`));
  const board=el('div','pboard');board.style.gridTemplateColumns=`repeat(${L.N},1fr)`;const cells=[];
  for(let y=0;y<L.N;y++)for(let x=0;x<L.N;x++){const c=el('div','pcell');if(L.rocks.some(p=>p[0]===x&&p[1]===y))c.textContent='🌳';if(L.gems.some(p=>p[0]===x&&p[1]===y)){c.textContent='💎';c.dataset.gem=1;}
    if(x===L.gx&&y===L.gy)c.textContent=L.goal;board.appendChild(c);cells.push(c);}
  const uni=el('div','puni','🦄');board.appendChild(uni);
  const place=(x,y)=>{uni.style.left=`calc(${x} * 100% / ${L.N})`;uni.style.top=`calc(${y} * 100% / ${L.N})`;uni.style.width=uni.style.height=`calc(100% / ${L.N})`;};place(L.sx,L.sy);
  w.appendChild(board);const bar=el('div','pbar');w.appendChild(bar);
  const draw=()=>{bar.innerHTML=prog.length?prog.map(d=>`<span>${DIRS[d][2]}</span>`).join(''):'<i>Dodaj strelice…</i>';};draw();
  const pad=el('div','ppad');[['l',0],['u',1],['d',1],['r',0]].forEach(([d])=>pad.appendChild(button('btn soft',DIRS[d][2],()=>{if(running||prog.length>=14)return;prog.push(d);SFX.pop();say(DIRS[d][3]);draw();},DIRS[d][3])));w.appendChild(pad);
  const ctl=el('div','row');ctl.appendChild(button('btn soft','↩️ Obriši',()=>{if(running)return;prog.pop();SFX.tap();draw();},'Obriši zadnju strelicu'));
  ctl.appendChild(button('btn','▶ Kreni!',run,'Kreni'));ctl.appendChild(button('btn soft','🔄 Novi',()=>programer(n),'Novi zadatak'));w.appendChild(ctl);
  say(`Složi strelice da jednorog dođe do cilja. Pa pritisni kreni!`,{prompt:true});
  function run(){if(running||!prog.length)return;running=true;let x=L.sx,y=L.sy,i=0;const spans=[...bar.children];place(x,y);
    const step=()=>{spans.forEach((s,k)=>s.classList.toggle('on',k===i));if(i>=prog.length){return finish(x===L.gx&&y===L.gy);}
      const d=DIRS[prog[i]];const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=L.N||ny>=L.N||L.rocks.some(p=>p[0]===nx&&p[1]===ny)){uni.classList.add('bump');SFX.no();setTimeout(()=>{uni.classList.remove('bump');fail(nx<0||ny<0||nx>=L.N||ny>=L.N?'Ups! Tu je kraj ploče.':'Ups! Tu je drvo.');},450);return;}
      x=nx;y=ny;place(x,y);SFX.tap();const c=cells[y*L.N+x];if(c.dataset.gem){delete c.dataset.gem;c.textContent='';SFX.pop();addStar();}
      i++;if(x===L.gx&&y===L.gy)return setTimeout(()=>finish(true),450);setTimeout(step,480);};setTimeout(step,250);}
  function fail(t){running=false;stat('Programer',false);sayThen(t+' Popravi strelice i probaj opet.',()=>{place(L.sx,L.sy);[...bar.children].forEach(s=>s.classList.remove('on'));},300);}
  function finish(ok){running=false;if(!ok){return fail('Jednorog nije stigao do cilja.');}
    SFX.win();confetti(110);addStar(2);stat('Programer',true);store('prLvl',Math.max(load('prLvl',0),n+1));
    const short=prog.length<=L.best;sayThen(short?'Bravo! Jednorog je stigao do cilja!':'Bravo, stigao je! Možeš li i s manje strelica?',()=>{if(document.body.contains(board))programer(n+1);},1200);}}

  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.c}"/>`;if(p.land)s+=`<path d="M${cx-r*.5} ${cy-r*.3}q${r*.4} -${r*.5} ${r*.7} 0t${r*.2} ${r*.5}q-${r*.5} ${r*.3} -${r*.9} 0z" fill="#40c057"/>`;
  if(p.bands)s+=`<path d="M${cx-r} ${cy-r*.3}h${2*r}M${cx-r} ${cy+r*.25}h${2*r}" stroke="#a0704a" stroke-width="${2*k}"/>`;return s;}

  box.innerHTML=s+'</svg>';box.querySelector('svg').addEventListener('click',e=>{const g=e.target.closest('.orb');if(g){const p=PLANETS[+g.dataset.i];SFX.pop();say(`${p.n}. ${p.f}`);}

const ADVORD=[7,15,2,21,11,18,4,13,23,9,1,17,24,6,12,20,3,10,16,22,5,14,19,8];
function adventScreen(demo){const now=new Date(),Y=now.getFullYear(),dec=now.getMonth()===11;const today=demo?24:dec?now.getDate():0;const key='advent-'+Y;const opened=load(key,[]);

const CSN='var(--c-snimi)';
const RECW=[['jednorog','🦄'],['dinosaur','🦕'],['Leona','👧'],['sladoled','🍦'],['helikopter','🚁'],['krokodil','🐊'],['Sretan rođendan','🎂'],['Bok, ja sam Leona!','👋'],['hobotnica','🐙'],['kukuriku','🐓'],['lubenica','🍉'],['Volim te, mama!','❤️'],['Volim te, tata!','💙']];
let recBuf=null;
/* explain, before asking, why the microphone cannot work here */
const MIC_FRAME='<b>Na claude.ai poveznici snimanje nije dopušteno.</b><br>Snimanje radi u verziji sa Synologyja (https adresa) ili u Windows verziji (Pokreni Leona uci).';
function micBlocked(){const pp=document.permissionsPolicy||document.featurePolicy;let allowed=true;try{if(pp&&pp.allowsFeature)allowed=pp.allowsFeature('microphone');}catch(e){}
  if(!allowed)return MIC_FRAME;if(false)return '<b>Na claude.ai poveznici snimanje nije dopušteno.</b><br>Snimanje radi u verziji sa Synologyja (https adresa) ili u Windows verziji (Pokreni Leona uci).';
  if(!window.isSecureContext)return '<b>Snimanje radi samo na https adresi.</b><br>Otvori aplikaciju preko https://…synology.me/leona/ umjesto http://192.168… adrese.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return 'Ovaj preglednik ne može snimati zvuk. Probaj u Chromeu ili Edgeu.';return '';}
function modSnimi(){const w=screen('Snimi svoj glas',home,CSN);let wd=pick(RECW);const c=el('div','card');
  const top=el('div','',`<div class="emo">${wd[1]}</div><div class="word">Reci: „${wd[0]}”</div>`);c.appendChild(top);
  const r0=el('div','row');r0.appendChild(button('btn soft','🔊 Poslušaj',()=>say(wd[0])));r0.appendChild(button('btn soft','🔀 Druga riječ',()=>{wd=pick(RECW.filter(x=>x!==wd));top.innerHTML=`<div class="emo">${wd[1]}</div><div class="word">Reci: „${wd[0]}”</div>`;say('Reci: '+wd[0]);}));c.appendChild(r0);
  const rb=button('recbtn','🎤',()=>rec.state==='rec'?rec.stop():start(),'Snimi');c.appendChild(rb);const meter=el('div','pbar2','<i></i>');c.appendChild(meter);
  const info=el('p','sub','Dodirni mikrofon i reci riječ. Snimanje traje najviše 5 sekundi.');c.appendChild(info);
  const play=el('div','row');[['▶ Moj glas',1],['🐭 Mišić',1.7],['🐻 Medo',.62],['🔁 Unatrag',-1]].forEach(([n,rate])=>play.appendChild(button('btn',n,()=>playRec(rate),n)));play.hidden=!recBuf;c.appendChild(play);w.appendChild(c);
  const rec={state:'idle',stop:()=>{}};
  const why=micBlocked();if(why){info.innerHTML=why;rb.classList.add('dis');}
  async function start(){const w2=micBlocked();if(w2){info.innerHTML=w2;say('Ovdje mikrofon ne radi. Neka mama ili tata pogledaju uputu.');return;}
    try{audio();if(TTS)TTS.cancel();const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream);const chunks=[];
      let an=null,raf=0;try{const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=512;src.connect(an);}catch(e){}
      const data=new Uint8Array(256);const lv=()=>{if(!an)return;an.getByteTimeDomainData(data);let m=0;for(const v of data)m=Math.max(m,Math.abs(v-128));meter.firstChild.style.width=Math.min(100,m*1.6)+'%';raf=requestAnimationFrame(lv);};
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=async()=>{cancelAnimationFrame(raf);meter.firstChild.style.width='0%';stream.getTracks().forEach(t=>t.stop());rec.state='idle';rb.classList.remove('on');rb.textContent='🎤';
        try{const ab=await new Blob(chunks).arrayBuffer();recBuf=await ac.decodeAudioData(ab);play.hidden=false;info.textContent='Bravo! Poslušaj svoj glas. Probaj i mišića i medu!';stat('Snimi glas',true);playRec(1);}
        catch(e){info.textContent='Snimka nije uspjela. Probaj ponovno.';}};
      mr.start();rec.state='rec';rec.stop=()=>{try{mr.stop();}catch(e){}};rb.classList.add('on');rb.textContent='⏹';info.textContent='Snimam… govori sada!';lv();setTimeout(()=>{if(rec.state==='rec')rec.stop();},5000);}
    catch(e){const n=e&&e.name;info.innerHTML=window.self!==window.top&&n==='NotAllowedError'?MIC_FRAME:n==='NotFoundError'?'Na ovom uređaju nije pronađen mikrofon.':n==='NotReadableError'?'Mikrofon trenutno koristi druga aplikacija. Zatvori je pa probaj opet.':
      '<b>Mikrofon je blokiran.</b><br>Android Chrome: dodirni ikonu lijevo od adrese → <i>Dopuštenja</i> → <i>Mikrofon</i> → <i>Dopusti</i>, pa osvježi stranicu.<br>Provjeri i: Postavke telefona → Aplikacije → Chrome → Dopuštenja → Mikrofon.';}}
  function playRec(rate){if(!recBuf||!ac)return;withAudio(()=>{let b=recBuf;if(rate<0){b=ac.createBuffer(recBuf.numberOfChannels,recBuf.length,recBuf.sampleRate);for(let ch=0;ch<b.numberOfChannels;ch++){const s=recBuf.getChannelData(ch),d=b.getChannelData(ch);for(let i=0;i<s.length;i++)d[i]=s[s.length-1-i];}}
    const s=ac.createBufferSource();s.buffer=b;s.playbackRate.value=Math.abs(rate);const g=ac.createGain();g.gain.value=1.4;s.connect(g).connect(ac.destination);s.start();});}
  say('Snimi svoj glas! Dodirni mikrofon i reci: '+wd[0],{prompt:true});}
